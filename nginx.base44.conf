user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ensure .webmanifest is served with the correct MIME type
    types {
        application/manifest+json webmanifest;
    }

    sendfile    on;
    keepalive_timeout  65;
    gzip        on;
    gzip_types  text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  _;
        root         /app;
        index        index.html;

        # CORS headers so browser fetches to ESPN API work cleanly
        add_header Access-Control-Allow-Origin "*" always;

        # Vercel analytics scripts only exist on Vercel's platform;
        # serve empty JS so the preview doesn't 404 on these paths.
        location /_vercel/ {
            default_type application/javascript;
            return 200 "";
        }

        # Google Analytics: analytics.js reads the measurement id from this
        # generated file (docker-compose.base44.yml writes it at container start
        # from the GA_MEASUREMENT_ID environment variable). On hosts without this
        # location (a plain static deploy) the committed ga-config.js in the repo
        # root is served instead.
        location = /ga-config.js {
            root /run/ga;
            add_header Cache-Control "no-store" always;
        }

        # Folder-based routing: /basketball/ serves /basketball/index.html
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
