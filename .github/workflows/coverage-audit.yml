# Asks ESPN, competition by competition, whether it is actually serving data
# for everything the site registers — and writes the answer to
# COVERAGE-AUDIT.md + testdata/coverage-audit.json.
#
# COMPETITION-COVERAGE.md counts what the code wires up (261 competitions).
# This run counts what the upstream API answers: live / idle (out of season) /
# empty / dead. It is the only way to notice a slug that is registered
# everywhere the contract demands and still 400s forever.
#
# Manual only (workflow_dispatch) plus a weekly Monday run — it makes a few
# hundred requests, so it has no business firing on every push.

name: Coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
  # TEMPORARY, same as prerender.yml: GitHub only exposes workflow_dispatch for
  # files that exist on the default branch, so until this lands on main the
  # only way to run it is a push trigger scoped to the working branch. Remove
  # this block when the branch merges.
  push:
    branches: [arena/01a0f3fd-livematches-hyper-co-ke]
    paths:
      - 'tools/audit-coverage.mjs'
      - '.github/workflows/coverage-audit.yml'

permissions:
  contents: write

concurrency:
  group: coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ask ESPN which leagues it publishes for the numeric-id sports
        run: node tools/audit-coverage.mjs --discover rugby,cricket

      - name: Probe every registered competition
        run: node tools/audit-coverage.mjs

      - name: Verify the repository still passes its checks
        run: node testdata/verify.mjs

      - name: Show the summary in the run log
        run: sed -n '/## Totals/,/^## By sport/p' COVERAGE-AUDIT.md

      - name: Commit the audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COVERAGE-AUDIT.md testdata/coverage-audit.json testdata/espn-league-directory.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Coverage audit: refresh which competitions ESPN is actually serving"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
